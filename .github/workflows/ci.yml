name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run --cwd scripts format:check
      - run: bun run --cwd scripts typecheck
      - run: bun run --cwd scripts lint
      - run: bun run --cwd scripts test

  monorepo:
    name: monorepo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: check-comments (added lines)
        run: bun scripts/check-comments/main.ts --base "$BASE_SHA"

      - name: Install gitleaks and osv-scanner
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          OSV_SCANNER_VERSION: 2.7.1
          OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$bin" gitleaks
          curl -fsSL -o "$bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $bin/osv-scanner" | sha256sum -c -
          chmod +x "$bin/osv-scanner"
          echo "$bin" >> "$GITHUB_PATH"

      - name: gitleaks (diff)
        run: gitleaks git --no-banner --redact --log-opts="${BASE_SHA}..HEAD" .

      - name: typos
        uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

      - name: lychee (internal links)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress './**/*.md'
          failIfEmpty: false
          jobSummary: false

      - name: osv-scanner (new vulnerabilities)
        run: |
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          scan() {
            osv-scanner scan source --recursive --allow-no-lockfiles --format json --output-file "$1" "$2" || [ $? -eq 1 ]
          }
          scan "$RUNNER_TEMP/osv-base.json" "$RUNNER_TEMP/base"
          scan "$RUNNER_TEMP/osv-head.json" .
          bun scripts/new-vulns/main.ts "$RUNNER_TEMP/osv-base.json" "$RUNNER_TEMP/osv-head.json"

      - run: docker compose config --quiet
      - run: bun scripts/compose-budget/main.ts .

  pr-title:
    name: pr-title
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun scripts/pr-title/main.ts "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.32"
          enable-cache: false

      - run: bun scripts/workflow-policy/main.ts .github/workflows
      - run: uvx --from actionlint-py==1.7.12.25 actionlint
      - run: uvx zizmor==1.33.1 --format=github .
        env:
          GH_TOKEN: ${{ github.token }}

  gate:
    name: gate
    if: ${{ always() }}
    needs: [scripts, monorepo, pr-title, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun scripts/gate-verdict/main.ts "$NEEDS"
        env:
          NEEDS: ${{ toJSON(needs) }}
