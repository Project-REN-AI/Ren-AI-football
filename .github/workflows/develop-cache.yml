name: develop-cache

on:
  push:
    branches: [develop]

permissions: {}

concurrency:
  group: develop-cache
  cancel-in-progress: false

jobs:
  services:
    name: services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.services.outputs.verdict }}
      images: ${{ steps.services.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - id: services
        run: |
          verdict=$(bun scripts/affected-services/main.ts --json --all HEAD)
          images=$(jq -c '.services[] | {name, path}' <<< "$verdict" | while read -r service; do
            if [ -f "$(jq -r .path <<< "$service")/Dockerfile" ]; then echo "$service"; fi
          done | jq -cs .)
          echo "$verdict"
          echo "images: $images"
          {
            echo "verdict=$verdict"
            echo "images=$images"
          } >> "$GITHUB_OUTPUT"

  bun:
    name: bun
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          lookup-only: true

      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        run: bun install --frozen-lockfile

  maven:
    name: maven
    needs: [services]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml', '**/.mvn/wrapper/maven-wrapper.properties') }}
          lookup-only: true

      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        env:
          VERDICT: ${{ needs.services.outputs.verdict }}
        run: |
          jq -r '.services[] | select(.language == "java") | .path' <<< "$VERDICT" | while read -r path; do
            (cd "$path" && ./mvnw --batch-mode --no-transfer-progress dependency:go-offline test-compile)
          done

  uv:
    name: uv
    needs: [services]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
          lookup-only: true

      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.32"
          enable-cache: false
          cache-local-path: ${{ runner.temp }}/uv-cache

      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        env:
          VERDICT: ${{ needs.services.outputs.verdict }}
        run: |
          [ "$(uv cache dir)" = "$RUNNER_TEMP/uv-cache" ] || { echo "uv cache dir is $(uv cache dir), not $RUNNER_TEMP/uv-cache" >&2; exit 1; }
          jq -r '.services[] | select(.language == "python") | .path' <<< "$VERDICT" | while read -r path; do
            uv sync --locked --directory "$path"
          done
          uv cache prune --ci

  go:
    name: go
    needs: [services]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
          lookup-only: true

      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        name: Install Go
        env:
          GO_VERSION: 1.27.4
          GO_SHA256: 7ecd542f86ccbbb5017de33ac529872bc48c71f4edb658d63a18d2206f482b9b
        run: |
          curl -fsSL -o "$RUNNER_TEMP/go.zip" \
            "https://proxy.golang.org/golang.org/toolchain/@v/v0.0.1-go${GO_VERSION}.linux-amd64.zip"
          echo "${GO_SHA256}  $RUNNER_TEMP/go.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/go.zip" -d "$RUNNER_TEMP/go"
          echo "$RUNNER_TEMP/go/golang.org/toolchain@v0.0.1-go${GO_VERSION}.linux-amd64/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/gobin" >> "$GITHUB_PATH"
          {
            echo "GOTOOLCHAIN=local"
            echo "GOBIN=$RUNNER_TEMP/gobin"
          } >> "$GITHUB_ENV"

      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        name: Build Go modules and CI tools
        env:
          GOLANGCI_LINT_VERSION: v2.15.0
          GOVULNCHECK_VERSION: v1.10.0
          GO_ARCH_LINT_VERSION: v1.19.2
          VERDICT: ${{ needs.services.outputs.verdict }}
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          go install "github.com/fe3dback/go-arch-lint@${GO_ARCH_LINT_VERSION}"
          jq -r '.services[] | select(.language == "go") | .path' <<< "$VERDICT" | while read -r path; do
            go -C "$path" mod download
            go -C "$path" build ./...
            go -C "$path" test -c -o "$RUNNER_TEMP/go-test-binaries/" ./...
          done

  images:
    name: image / ${{ matrix.service.name }}
    needs: [services]
    if: ${{ needs.services.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.services.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.service.path }}/Dockerfile
          push: false
          cache-from: type=gha,scope=image-${{ matrix.service.name }}
          cache-to: type=gha,scope=image-${{ matrix.service.name }}
