[project]
name = "python-example"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.165"]

[dependency-groups]
dev = [
  "httpx2>=2.16.2",
  "import-linter>=2.17",
  "mypy>=2.4",
  "pytest>=9.2",
  "pytest-xdist>=3.8",
  "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "SIM", "RUF", "PT", "ANN", "ERA", "PGH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "-n 4"
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["python_example"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "api depends on domain, never the reverse"
type = "layers"
layers = ["python_example.api", "python_example.domain"]

[[tool.importlinter.contracts]]
name = "domain does not import the web framework, its models or HTTP clients"
type = "forbidden"
source_modules = ["python_example.domain"]
forbidden_modules = ["fastapi", "starlette", "pydantic", "httpx2"]
