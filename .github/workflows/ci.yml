name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scripts:
    name: scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run --cwd scripts format:check
      - run: bun run --cwd scripts typecheck
      - run: bun run --cwd scripts lint
      - run: bun run --cwd scripts test

  pr-title:
    name: pr-title
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun scripts/pr-title/main.ts "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.32"
          enable-cache: false

      - run: bun scripts/workflow-policy/main.ts .github/workflows
      - run: uvx --from actionlint-py==1.7.12.25 actionlint
      - run: uvx zizmor==1.33.1 --format=github .
        env:
          GH_TOKEN: ${{ github.token }}

  gate:
    name: gate
    if: ${{ always() }}
    needs: [scripts, pr-title, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun scripts/gate-verdict/main.ts "$NEEDS"
        env:
          NEEDS: ${{ toJSON(needs) }}
