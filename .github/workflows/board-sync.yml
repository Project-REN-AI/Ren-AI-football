# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
name: board-sync

on:
  issues:
    types: [reopened, closed, assigned, unassigned, labeled, unlabeled]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: board-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync project board
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ci-bot
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.CI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: read
          permission-organization-projects: write

      - run: bun scripts/board-sync/main.ts
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_OWNER: ${{ github.repository_owner }}
          PROJECT_NUMBER: ${{ vars.SCOUT_PROJECT_NUMBER }}
          REPOSITORY: ${{ github.repository }}
